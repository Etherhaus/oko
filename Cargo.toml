[package]
name = "oko-detector"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A cross-platform detector for DNS, DPI and IP-level blocking of online services"
license = "MIT"
repository = "https://github.com/etherhaus/oko"
keywords = ["network", "censorship", "diagnostics", "dpi", "cli"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "oko"
path = "src/main.rs"

[dependencies]
# Slint 1.18 has no public clipboard API, so the inspector's copy button
# talks to the platform itself. Already in the tree through the winit
# backend, so this adds no new crates.
arboard = "3.7"
clap = { version = "4.6", features = ["derive"] }
# The window. The default backend is winit with the femtovg renderer; the
# portal-backed file dialog keeps GTK out of the build.
rfd = "0.18"
slint = "1.18"
# `ring` only: ureq already selects it, and two compiled-in providers make
# `ClientConfig::builder()` panic at run time.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
webpki-roots = "1"

[build-dependencies]
slint-build = "1.18"

[profile.release]
strip = true
lto = true
